<meta name="robots" content="noindex,nofollow,noarchive"><title>SAW 지원사업·공고 선별</title><style>
:root{--brand:#674498;--bg:#f7f7f5;--fg:#1d1d1b;--mut:#77756f;--line:#e2e0da;--card:#fff;--ok:#15803d;--mid:#b45309;--no:#9ca3af;--acc:#c2410c}
@media (prefers-color-scheme:dark){:root{--brand:#a78bd6;--brand:#674498;--bg:#151514;--fg:#ecebe7;--mut:#9a978f;--line:#2e2d2a;--card:#1e1e1c;--ok:#4ade80;--mid:#fbbf24;--no:#6b7280;--acc:#fb923c}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 4px} .sub{color:var(--mut);font-size:12px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:16px;padding:6px 14px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--fg);color:var(--bg)}
section{display:none} section.on{display:block}
h2{font-size:15px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.top{display:flex;gap:10px;align-items:baseline}
.v{font-size:12px;font-weight:700;white-space:nowrap} .v.가능{color:var(--ok)} .v.조건부{color:var(--mid)} .v.불가,.v.무관,.v.정보부족{color:var(--no)}
.t{font-weight:600;color:var(--fg);text-decoration:none;flex:1} .t:hover{text-decoration:underline}
.d{white-space:nowrap;font-size:12px;color:var(--mut)} .d.u{color:var(--acc);font-weight:700}
.m{color:var(--mut);font-size:12px;margin-top:3px} .why{margin-top:6px} .chk{margin:4px 0 0 0;padding-left:18px;color:var(--mut);font-size:13px}
details{margin-top:6px} summary{cursor:pointer;color:var(--mut);font-size:12px}
.low .card{opacity:.6}

.gate{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
.gate h1{font-size:19px;margin:0 0 6px} .gate input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
background:var(--bg);color:var(--fg);font:inherit;margin:14px 0 10px} .gate button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.gate .err{color:var(--acc);font-size:12px;min-height:16px;margin-top:8px} .gate label{font-size:12px;color:var(--mut)}
header{display:flex;align-items:center;gap:10px;margin-bottom:6px} header .dot{width:10px;height:10px;border-radius:50%;background:var(--brand)}

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},key,u(P.c));return new TextDecoder().decode(pt)}
function show(h){document.getElementById('app').innerHTML='<header><span class="dot"></span><h1>SAW 지원사업·공고 선별</h1></header>'+h;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,section').forEach(e=>e.classList.remove('on'));
b.classList.add('on');document.getElementById(b.dataset.t).classList.add('on')})}
document.getElementById('g').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value;
try{const h=await open_(pw);if(document.getElementById('rm').checked){try{localStorage.setItem(K,pw)}catch(_){}}show(h)}
catch(_){document.getElementById('e').textContent='비밀번호가 맞지 않습니다'}};
(async()=>{let s=null;try{s=localStorage.getItem(K)}catch(_){}if(s){try{show(await open_(s))}catch(_){try{localStorage.removeItem(K)}catch(__){}}}})();
</script></body></html>
