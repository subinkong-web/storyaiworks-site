button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-size:15px;font-weight:600}

const K='saw-control-pw';
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const te=new TextEncoder(),c=crypto.subtle;
  const km=await c.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await c.deriveKey({name:'PBKDF2',salt:b(SEALED.s),iterations:SEALED.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await c.decrypt({name:'AES-GCM',iv:b(SEALED.i)},key,b(SEALED.c)));
  document.open();document.write(html);document.close();
}
async function go(pw,remember){
  try{await open_(pw);if(remember){try{localStorage.setItem(K,pw)}catch(e){}}}
  catch(e){try{localStorage.removeItem(K)}catch(_){}document.getElementById('m').textContent='비밀번호가 맞지 않습니다';}
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();document.getElementById('m').textContent='여는 중…';go(document.getElementById('pw').value,document.getElementById('rm').checked)};
