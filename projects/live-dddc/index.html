<style>:root{--bg:#f4f4f2;--fg:#1d1d1b;--mute:#777;--card:#fff;--line:#ddd;--acc:#c8501e}

button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-size:15px;font-weight:600}
#m{color:var(--acc);font-size:13px;min-height:18px;margin-top:10px}</style></head><body>

async function open_(pw){

  const km=await c.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
