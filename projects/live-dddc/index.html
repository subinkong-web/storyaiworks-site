<title>SAW Control — 관제</title>
<style>
:root{--ink:#111;--sub:#666;--mute:#9a9a9a;--line:#e5e5e2;--bg:#f6f6f4;--card:#fff;--soft:#f1f1ee;
--red:#c62828;--amber:#b26a00;--yel:#e0a100;--blue:#1e5fbf;--green:#2e7d32;--orange:#d84315;
--red-bg:#fdecea;--amber-bg:#fff4dc;--blue-bg:#e7effb;--orange-bg:#fbe9e2;--today:#1e5fbf;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--ink:#ececea;--sub:#a5a5a2;--mute:#77777a;--line:#2c2c2e;--bg:#121214;--card:#1c1c1e;--soft:#242426;
--red:#ff6b6b;--amber:#f0b45a;--yel:#e9c15a;--blue:#6fa3ff;--green:#5fd07a;--orange:#ff8c66;
--red-bg:#3a1f1f;--amber-bg:#3a2f18;--blue-bg:#1d2a44;--orange-bg:#3c2419}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{margin:0;word-break:keep-all;overflow-wrap:anywhere;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Helvetica Neue",sans-serif;line-height:1.45;font-variant-numeric:tabular-nums;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:1360px;margin:0 auto;padding:0 14px 60px}
/* ── 머리 ── */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
.top .in{max-width:1360px;margin:0 auto}
.t1{display:flex;align-items:baseline;gap:10px}
.t1 h1{font-size:1.06rem;margin:0;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.t1 .stamp{color:var(--sub);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}.t1 .stamp b{color:var(--ink);font-weight:600}
.t1 .fbtn{margin-left:auto;white-space:nowrap;flex:none;color:var(--sub);font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--card)}
.t1 .fbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-top:8px;gap:2px}
.seg button{flex:1;padding:6px 4px;border-radius:8px;font-size:.9rem;font-weight:600;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.more{display:none;margin-top:8px;gap:6px;flex-wrap:wrap;align-items:center}.more.open{display:flex}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--sub)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.more .lb{color:var(--mute);font-size:.72rem;margin-left:6px}
#q{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:inherit;font-size:.9rem;background:var(--card);color:var(--ink);width:100%;margin-top:6px}
.sum{color:var(--sub);font-size:.82rem;padding:10px 2px 0}.sum b{color:var(--ink);font-weight:700}.sum .r{color:var(--red)}.sum .y{color:var(--amber)}
/* ── 공통 ── */
h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 0 8px;font-weight:800;display:flex;align-items:baseline;gap:8px}
h2 .n{color:var(--mute);font-weight:600;letter-spacing:0}h2 .opt{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0;font-size:.78rem}h2 .opt label{margin-left:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#bbb;flex:none}
.dot.g{background:var(--green)}.dot.y{background:var(--yel)}.dot.r{background:var(--red)}.dot.x{background:var(--mute)}
.tag{font-size:.74rem;font-weight:800;padding:2px 7px;border-radius:5px;white-space:nowrap;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;text-align:center;box-sizing:border-box}.now .tag{width:100%}
.tag.red{background:var(--red-bg);color:var(--red)}.tag.amber{background:var(--amber-bg);color:var(--amber)}.tag.orange{background:var(--orange-bg);color:var(--orange)}.tag.blue{background:var(--blue-bg);color:var(--blue)}
.own{display:inline-flex;gap:2px;vertical-align:middle}
.own i{font-style:normal;display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--soft);color:var(--sub);font-size:.68rem;font-weight:800;align-items:center;justify-content:center}
.own i.대{background:#1e5fbf;color:#fff}.own i.일{background:#5d4037;color:#fff}.own i.유{background:#00796b;color:#fff}.own i.외{background:#888;color:#fff}
.gn{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;white-space:nowrap;color:var(--gc,#78909c)}.gn::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--gc,#78909c)}
.card{border-left:4px solid var(--gc,#cfd8dc)}.now .row{border-left:4px solid var(--gc,#cfd8dc)}.tlg .lab{box-shadow:inset 4px 0 0 var(--gc,#cfd8dc)}
.gch{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.gch::-webkit-scrollbar{display:none}.gch .chip{flex:none}@media (min-width:700px){.gch{flex-wrap:wrap;overflow:visible}}.gch .chip{display:inline-flex;align-items:center;gap:5px}.gch .chip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--gc,#78909c)}.gch .chip.on{background:var(--gc);border-color:var(--gc);color:#fff}.gch .chip.on::before{background:#fff}
.org{font-size:.66rem;font-weight:800;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.st{font-size:.74rem;font-weight:700;color:var(--sub)}.st.검수{color:var(--orange)}.st.회신대기{color:var(--amber)}.st.보류{color:var(--mute)}.st.종결{color:var(--green)}
.bar{height:5px;background:var(--soft);border-radius:3px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.bar.full i{background:var(--green)}
.pg{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--sub);white-space:nowrap}.pg b{color:var(--ink);font-weight:700}
/* ── 이번 주 목표 ── */
.goals{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.goals h2{margin:0;padding:10px 14px 6px;font-size:.95rem}
.goals .gl{display:grid;grid-template-columns:22px 1fr auto;gap:8px 10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
.goals .gl .ck{font-size:1.05rem;color:var(--sub)}.goals .gl.done .ck{color:var(--green)}.goals .gl.done .t{text-decoration:line-through;color:var(--mute)}
.goals .gl .t{font-weight:700;min-width:0}.goals .gl .t small{display:block;font-weight:400;color:var(--sub);font-size:.8rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goals .gl .st{display:flex;gap:6px;align-items:center;flex:none}.goals .gl .st .dot{margin:0;flex:none;width:10px;height:10px;display:inline-block}
/* ── 지금 ── */
.now{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.now .row{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center;width:100%;text-align:left}
.now .row:last-child{border-bottom:0}.now .row:active{background:var(--soft)}
.now .nm{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}.now .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now .nx{grid-column:2;color:var(--sub);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now .pg{grid-column:2}
.now .empty{padding:16px;color:var(--mute)}
/* ── 이번 주 (일정) ── */
.agenda{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.agenda .day{display:grid;grid-template-columns:58px 1fr;border-bottom:1px solid var(--line)}.agenda .day:last-child{border-bottom:0}
.agenda .d{padding:10px 0 10px 14px;color:var(--sub);font-size:.8rem;line-height:1.2}.agenda .d b{display:block;font-size:1.15rem;color:var(--ink);font-weight:800}
.agenda .day.today .d b,.agenda .day.today .d{color:var(--blue)}.agenda .day.we .d{color:var(--mute)}
.agenda .items{padding:8px 12px 8px 0}
.agenda .it{display:flex;align-items:flex-start;gap:8px;padding:3px 0;width:100%;text-align:left;font-size:.92rem;min-width:0}.agenda .it .k{margin-top:5px}
.agenda .it .k{flex:none;width:12px;height:12px;display:inline-flex;align-items:center;justify-content:center}
.agenda .it .k.due::before{content:"";width:8px;height:8px;transform:rotate(45deg);background:var(--blue)}
.agenda .it .k.due.r::before{background:var(--red)}.agenda .it .k.due.y::before{background:var(--amber)}
.agenda .it .k.ms::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--blue)}
.agenda .it .txt{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}.agenda .it .txt b{font-weight:700}.agenda .it .txt span{color:var(--sub)}
.agenda .it .past{color:var(--red);font-size:.72rem;font-weight:800;margin-left:auto;flex:none}
.agenda .empty{padding:16px;color:var(--mute)}
/* ── 카드 ── */
.cards{display:grid;grid-template-columns:1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;display:flex;flex-direction:column;gap:7px;min-width:0}
.card:active{background:var(--soft)}

const ddHtml=p=>{const d=dd(p);if(d===null)return`<span class="dd">—</span>`;const c=d<=2?"r":(d<=7?"y":"");return`<span class="dd ${c}">${d<0?`+${-d}일`:`D-${d}`}<small>${md(p.due).slice(0,5)}${p.due_note?" "+esc(p.due_note):""}</small></span>`};

let F={owner:"전체",org:"전체",status:"전체",genre:"전체",q:""};
try{Object.assign(F,JSON.parse(localStorage.getItem("pm-f3")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("pm-f3",JSON.stringify(F))}catch(e){}};
function visible(p){if(F.owner!=="전체"&&!ownerKey(p.owner).includes(F.owner))return false;if(F.genre!=="전체"&&p.genre!==F.genre)return false;if(F.org!=="전체"&&p.org!==F.org)return false;if(F.status!=="전체"&&p.status!==F.status)return false;
 if(F.q){const q=F.q.toLowerCase();if(!(p.name+" "+(p.client||"")+" "+(p.next||"")).toLowerCase().includes(q))return false}return true}
const sortKey=p=>{const d=dd(p);return[ACTIVE.has(p.status)?0:(p.status==="보류"?1:2),d===null?9999:d,ST_ORDER.indexOf(p.status),-p.idle]};
const cmp=(a,b)=>{const x=sortKey(a),y=sortKey(b);for(let i=0;i<x.length;i++)if(x[i]!==y[i])return x[i]-y[i];return 0};

function header(){
 const owners=[...new Set(DATA.projects.flatMap(p=>ownerKey(p.owner)))].filter(o=>o!=="외부");
 $("#seg").innerHTML=["전체",...owners].map(o=>`<button class="${F.owner===o?"on":""}" data-v="${esc(o)}">${esc(o)}</button>`).join("");
 $("#seg").querySelectorAll("button").forEach(b=>b.onclick=()=>{F.owner=b.dataset.v;save();render()});
 const genres=(DATA.genres&&DATA.genres.length?DATA.genres:[...new Set(DATA.projects.map(p=>p.genre).filter(Boolean))]);
 $("#gch").innerHTML=`<button class="chip ${F.genre==="전체"?"on":""}" data-v="전체" style="--gc:#555">전체</button>`+genres.map(g=>`<button class="chip ${F.genre===g?"on":""}" data-v="${esc(g)}" style="--gc:${GC[g]||"#90a4ae"}">${esc(g)}</button>`).join("");
 $("#gch").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{F.genre=c.dataset.v;save();render()});
 const orgs=[...new Set(DATA.projects.map(p=>p.org).filter(Boolean))];
 const mk=(lb,key,vals)=>`<span class="lb">${lb}</span>`+["전체",...vals].map(v=>`<button class="chip ${F[key]===v?"on":""}" data-k="${key}" data-v="${esc(v)}">${esc(v)}</button>`).join("");
 $("#more").innerHTML=mk("소속","org",orgs)+mk("상태","status",ST_ORDER);
 $("#more").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{F[c.dataset.k]=c.dataset.v;save();render()});
 const active=F.org!=="전체"||F.status!=="전체"||F.q;$("#fbtn").classList.toggle("on",!!active);
}
$("#fbtn").onclick=()=>{const o=$("#more").classList.toggle("open");$("#q").hidden=!o;if(o)$("#q").focus()};
$("#q").oninput=e=>{F.q=e.target.value;save();render()};

function render(){
 today=new Date(DATA.today+"T00:00:00");STALE=DATA.stale_days;
 header();
 const all=DATA.projects.filter(visible).sort(cmp), act=all.filter(p=>ACTIVE.has(p.status));
 const due7=act.filter(p=>{const d=dd(p);return d!==null&&d<=7}), stale=act.filter(p=>p.idle>=STALE);
 $("#stamp").innerHTML=`집계 <b>${esc(DATA.stamp)}</b><span id="ago"></span>`;
 $("#sum").innerHTML=`진행 <b>${act.length}</b> · 7일 안 마감 <b class="${due7.length?"r":""}">${due7.length}</b> · 정체 <b class="${stale.length?"y":""}">${stale.length}</b> · 회신대기 <b>${all.filter(p=>p.status==="회신대기").length}</b> · 보류 ${all.filter(p=>p.status==="보류").length} · 종결 ${all.filter(p=>p.status==="종결").length}${all.length!==DATA.projects.length?` · <span style="color:var(--blue)">필터 ${all.length}/${DATA.projects.length}</span>`:""}`;
 // 이번 주 목표
 const G=DATA.goals;const gEl=$("#goals");
 if(G&&G.items&&G.items.length){const by=Object.fromEntries(DATA.projects.map(p=>[p.id,p]));
  gEl.hidden=false;gEl.innerHTML=`<h2>🎯 이번 주 목표 <span class="n">${esc(G.week||"")}</span></h2>`+G.items.map(it=>{const ps=(it.ids||[]).map(i=>by[i]).filter(Boolean);const allDone=it.done||(ps.length&&ps.every(p=>p.status==="종결"||p.status==="납품"));
   return`<button class="gl${allDone?" done":""}" data-id="${ps[0]?ps[0].id:""}"><span class="ck">${allDone?"☑":"☐"}</span><span class="t">${esc(it.t)}<small>${ps.map(p=>`${esc(p.name)}${p.due?` · ${md(p.due)}`:""}${p.due_note?` ${esc(p.due_note)}`:""}`).join(" / ")}</small></span><span class="st">${ps.map(p=>`<span class="dot ${health(p)}" title="${esc(p.name)}"></span>`).join("")}</span></button>`}).join("")}
 else gEl.hidden=true;
 // 지금
 const at=act.map(p=>[reason(p),p]).filter(x=>x[0]).sort((a,b)=>a[0].w-b[0].w||(dd(a[1])??999)-(dd(b[1])??999)).slice(0,8);
 $("#nown").textContent=at.length?`${at.length}건`:"";
 $("#now").innerHTML=at.length?at.map(([r,p])=>`<button class="row" data-id="${p.id}" ${gsty(p)}><span class="tag ${r.k}">${esc(r.t)}</span><span class="nm"><span class="dot ${health(p)}"></span><span>${esc(p.name)}</span></span><span class="nx">${p.due_note&&dd(p)!==null&&dd(p)<=7?`<b style="color:var(--ink)">${esc(p.due_note)}</b> · `:""}${esc(p.next||"다음 할 일 미정")}</span>${prog(p).total?`<span class="pg">${pgHtml(p)}</span>`:""}</button>`).join(""):`<div class="empty">지금 손댈 것이 없습니다.</div>`;
 // 이번 주 (14일 일정)
 const items=[];
 for(const p of act){
  if(p.due){const d=dd(p);if(d>=-3&&d<=13)items.push({d,date:p.due,p,kind:"due",t:p.due_note||"마감",h:health(p)})}
  for(const m of (p.milestones||[])){if(!m.due||m.done)continue;const d=Math.round((dayOf(m.due)-today)/864e5);if(d>=-3&&d<=13&&m.due!==p.due)items.push({d,date:m.due,p,kind:"ms",t:m.name,h:"g"})}
 }
 items.sort((a,b)=>a.d-b.d||cmp(a.p,b.p));
 const byDay=new Map();items.forEach(i=>{(byDay.get(i.date)||byDay.set(i.date,[]).get(i.date)).push(i)});
 $("#agn").textContent=items.length?`${items.length}건`:"";
 $("#agenda").innerHTML=byDay.size?[...byDay].map(([date,its])=>{const dt=dayOf(date);const we=dt.getDay()===0||dt.getDay()===6;const isT=date===DATA.today;const past=its[0].d<0;
  return`<div class="day ${isT?"today":""} ${we?"we":""}"><div class="d">${isT?"오늘":WD[dt.getDay()]}<b>${dt.getDate()}</b>${dt.getDate()===1||[...byDay.keys()][0]===date?`${dt.getMonth()+1}월`:""}</div><div class="items">${its.map(i=>`<button class="it" data-id="${i.p.id}"><span class="k ${i.kind} ${i.kind==="due"?(i.d<=2?"r":(i.d<=7?"y":"")):""}"></span><span class="txt"><b>${esc(i.p.name)}</b> <span>${esc(i.t)}</span></span>${i.d<0?`<span class="past">${-i.d}일 지남</span>`:""}</button>`).join("")}</div></div>`}).join("")
  :`<div class="empty">앞으로 2주 안에 잡힌 일정이 없습니다.</div>`;
 // 카드
 const card=p=>`<button class="card ${p.status==="보류"?"hold":""} ${p.status==="종결"?"done":""}" data-id="${p.id}" ${gsty(p)}>
  <div class="h"><span class="dot ${health(p)}"></span><span class="nm">${esc(p.name)}</span>${ACTIVE.has(p.status)?ddHtml(p):`<span class="st ${p.status}">${p.status}</span>`}</div>
  <div class="nx">${p.status==="종결"&&p.closed?`종결 ${md(p.closed.d).slice(0,5)} · 납품본 ${esc(p.closed.delivery||"-")}`:esc(p.next||"다음 할 일 미정")}</div>
  <div class="f">${pgHtml(p,true)}<span class="meta">${gnHtml(p)}<span class="org">${esc(p.org)}</span>${p.status!=="진행"?`<span class="st ${p.status}">${p.status}</span>`:""}${ownHtml(p.owner)}<span>${idleTxt(p)}</span></span></div></button>`;
 $("#actn").textContent=`${act.length}건`;$("#cards").innerHTML=act.map(card).join("");
 const hold=all.filter(p=>p.status==="보류"),done=all.filter(p=>p.status==="종결");
 $("#holds").textContent=`보류 ${hold.length}건`;$("#hold").innerHTML=hold.map(card).join("");$("#holdd").hidden=!hold.length;
 $("#dones").textContent=`종결 ${done.length}건`;$("#done").innerHTML=done.map(card).join("");$("#doned").hidden=!done.length;
 renderTL(all);
 document.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>openSheet(el.dataset.id));
 ago();
}
// 시트
function openSheet(id){const p=DATA.projects.find(x=>x.id===id);if(!p)return;const g=prog(p);
 $("#sheet").innerHTML=`<div class="grab"></div><button class="x" id="sx">×</button>
 <h3><span class="dot ${health(p)}"></span>${esc(p.name)}</h3><div class="sub">${gnHtml(p)} · ${esc(p.client||"")} · <span class="org">${esc(p.org)}</span></div>
 <div class="kv"><span class="k">상태</span><span><span class="st ${p.status}">${p.status}</span> · 담당 ${ownHtml(p.owner)} ${esc(p.owner||"")}</span>
 <span class="k">마감</span><span>${p.due?`${md(p.due)}${p.due_note?" · "+esc(p.due_note):""} (${dd(p)>=0?"D-"+dd(p):dd(p)*-1+"일 지남"})`:"없음"}</span>
 <span class="k">진행</span><span>${g.total?pgHtml(p):"마일스톤 없음"}${p.removal?`<div class="rm">↳ ${esc(p.removal)}</div>`:""}</span>
 <span class="k">다음</span><span>${esc(p.next||"미정")}</span>
 <span class="k">활동</span><span>${idleTxt(p)} · 갱신 ${md(p.updated)}${p.file_activity?` · 파일 ${md(p.file_activity)}`:""}</span></div>
 <div class="kv"><span class="k">마일스톤</span><span>${(p.milestones||[]).length?`<ul>${p.milestones.map(m=>`<li class="${m.done?"ok":""}">${m.done?"✔ ":""}${esc(m.name)}${m.due?" · "+md(m.due):""}</li>`).join("")}</ul>`:"없음"}</span>
 <span class="k">기록</span><span>${(p.log||[]).length?`<ul>${p.log.slice(0,6).map(l=>`<li><span style="color:var(--mute)">${md(l.d).slice(0,5)}</span> ${esc(l.t)}</li>`).join("")}</ul>`:"없음"}</span>
 ${p.closed?`<span class="k">종결</span><span>${md(p.closed.d)} · 납품본 ${esc(p.closed.delivery||"-")} · 문서 ${esc(p.closed.docno||"-")}</span>`:""}
 <span class="k">폴더</span><span>${(p.paths||[]).map(x=>`<code>${esc(x)}</code>`).join("<br>")||"미등록"}</span>
 <span class="k">id</span><span><code>${p.id}</code></span></div>`;
 $("#back").classList.add("on");$("#sheet").classList.add("on");$("#sx").onclick=closeSheet;history.replaceState(null,"","#"+id)}
function closeSheet(){$("#back").classList.remove("on");$("#sheet").classList.remove("on");history.replaceState(null,"",location.pathname+location.search)}

// 타임라인 (넓은 화면)
function renderTL(all){
 const narrow=!PRINTING&&!matchMedia("(min-width:1000px)").matches;const DAYS=28,back=narrow?1:3,start=new Date(today);start.setDate(start.getDate()-back);
 const days=[...Array(DAYS)].map((_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d});
 const idx=s=>{const d=dayOf(s);return d?Math.round((d-start)/864e5):null};
 const rows=all.filter(p=>ACTIVE.has(p.status));const g=$("#tlg");g.style.setProperty("--days",DAYS);
 let h=`<div class="hd lbl">프로젝트</div>`+days.map((d,i)=>{const we=d.getDay()===0||d.getDay()===6,td=d.getTime()===today.getTime();return`<div class="hd ${we?"we":""} ${td?"td":""}">${(d.getDate()===1||i===0)?`<b>${d.getMonth()+1}/${d.getDate()}</b>`:`<b>${d.getDate()}</b>`}${WD[d.getDay()]}</div>`}).join("");
 const groups=$("#byowner").checked?[...new Set(rows.map(p=>ownerKey(p.owner)[0]||"미정"))].map(o=>[o,rows.filter(p=>(ownerKey(p.owner)[0]||"미정")===o)]):[[null,rows]];
 for(const [gn,ps] of groups){if(gn!==null)h+=`<div class="grp">${esc(gn)} · ${ps.length}건</div>`;
  const dated=ps.filter(p=>p.due||(p.milestones||[]).some(m=>m.due&&!m.done)),undated=ps.filter(p=>!dated.includes(p));
  for(const p of dated)h+=rowTL(p,days,idx);
  if(undated.length){h+=`<div class="grp" style="background:var(--card);font-weight:400">일정 없음 ${undated.length}건</div>`;for(const p of undated)h+=rowTL(p,days,idx)}}
 g.innerHTML=h;
}
function rowTL(p,days,idx){const hc=health(p),d=dd(p),di=idx(p.due),ti=days.findIndex(x=>x.getTime()===today.getTime());const cells=days.map(()=>[]);const later=[];
 (p.milestones||[]).forEach(m=>{if(!m.due)return;const i=idx(m.due);if(i===null)return;if(i>=days.length){if(!m.done)later.push(`${md(m.due).slice(0,5)} ${m.name}`);return}if(i<0)return;cells[i].push(`<span class="mk ms ${m.done?"ok":""} ${i<ti?"past":""}" title="${esc(m.name)} ${md(m.due)}"><span class="t">${esc(m.name)}</span></span>`)});
 if(p.due){if(di!==null&&di<days.length&&di>=0)cells[di].push(`<span class="mk due ${d<=2?"r":(d<=7?"y":"")}" title="마감 ${md(p.due)}"><span class="t">${esc(p.due_note||"마감")}</span></span>`);else if(di>=days.length)later.unshift(`◆ ${md(p.due).slice(0,5)} ${p.due_note||"마감"}`)}
 const barTo=di===null?null:Math.min(di,days.length-1);
 let h=`<div class="lab" data-id="${p.id}" ${gsty(p)}><span class="dot ${hc}"></span><span class="nm">${esc(p.name)}</span><span class="s">${ownerKey(p.owner).map(k=>ownIni[k]||k).join("·")}</span></div>`;
 h+=days.map((dt,i)=>{const we=dt.getDay()===0||dt.getDay()===6,td=i===ti;let inner="";
  if(barTo!==null&&i>=ti&&i<=barTo)inner+=`<span class="tbar ${hc==="r"?"r":(hc==="y"?"y":"")}"></span>`;inner+=cells[i].join("");
  if(i===days.length-1&&later.length)inner+=`<span class="arrow" title="${esc(later.join(" / "))}">→ ${esc(later[0])}${later.length>1?` +${later.length-1}`:""}</span>`;
  return`<div class="${we?"we":""} ${td?"td":""}">${inner}</div>`}).join("");return h}
